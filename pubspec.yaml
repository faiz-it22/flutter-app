name: projects
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

#------------- Packages Start -------------#

dependencies:
  flutter:
    sdk: flutter

  # Utility Packages
  flutter_dotenv: ^6.0.0
  http: ^1.6.0
  intl: ^0.18.1
  logger: ^2.0.2
  url_launcher: ^6.1.14
  flutter_native_splash: ^2.3.1
  smooth_page_indicator: ^1.1.0
  shared_preferences: ^2.5.4
  connectivity_plus: ^6.0.3
  permission_handler: ^11.1.0

  # Bluetooth Low Energy
  flutter_blue_plus: ^1.31.11

  # Icons
  iconsax_flutter: ^1.0.1
  cupertino_icons: ^1.0.6

  # State Management
  flutter_bloc: ^8.1.3

  # Navigation
  go_router: ^10.1.2

  # Dependency Injection
  get_it: ^7.6.4
  injectable: 2.3.2

  # Networking (Strictly pinned for compatibility)
  dio: 5.9.0
  retrofit: 4.9.1
  json_annotation: 4.8.1

  # Local Database (Hive NoSQL)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Freezed Annotation
  freezed_annotation: ^2.4.1

#------------- Packages End -------------#

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: any
  injectable_generator: 2.4.1
  retrofit_generator: 8.1.0
  json_serializable: 6.7.1
  hive_generator: ^2.0.1
  freezed: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/on_boarding_images/
    - assets/logos/

  fonts:
    - family: Poppins
      fonts:
      - asset: assets/fonts/Poppins/Poppins-Light.ttf
        weight: 300
      - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        weight: 400
      - asset: assets/fonts/Poppins/Poppins-Italic.ttf
        style: italic
      - asset: assets/fonts/Poppins/Poppins-Medium.ttf
        weight: 500
      - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
        weight: 500
        style: italic
      - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
        weight: 600
      - asset: assets/fonts/Poppins/Poppins-SemiBoldItalic.ttf
        weight: 600
        style: italic
      - asset: assets/fonts/Poppins/Poppins-Bold.ttf
        weight: 700
      - asset: assets/fonts/Poppins/Poppins-BoldItalic.ttf
        weight: 700
        style: italic
      - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
        weight: 800
      - asset: assets/fonts/Poppins/Poppins-ExtraBoldItalic.ttf
        weight: 800
        style: italic
      - asset: assets/fonts/Poppins/Poppins-Black.ttf
        weight: 900
      - asset: assets/fonts/Poppins/Poppins-BlackItalic.ttf
        weight: 900
        style: italic
